# 小说白名单基础配置，供路由器与本地客户端使用，由 Novel_Router.ini 引用
# 节点、策略组和 rules 由 subconverter 生成；OpenClash 管理入站/DNS 监听和防火墙。
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - "*.arpa"
    - time.apple.com
    - time.windows.com
    - "+.pool.ntp.org"
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false
  # 所有 DNS 查询直连，不依赖小说代理节点。
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 包括 Facebook、Firebase 在内，统一使用直连解析。
  nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  proxy-server-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver-follow-policy: false
  fallback: []
  nameserver-policy: {}
