# 小说白名单基础配置，供路由器与本地客户端使用，由 Novel_Router.ini 引用
# 节点、策略组和 rules 由 subconverter 生成；OpenClash 管理入站/DNS 监听和防火墙。
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - "*.arpa"
    - time.apple.com
    - time.windows.com
    - "+.pool.ntp.org"
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false
  # 出口由 DNS 地址后的组名显式指定，避免 MATCH,DIRECT 影响境外 DNS。
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 普通用户的解析不依赖小说代理节点。
  nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  proxy-server-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver-follow-policy: false
  fallback: []
  # 与 INI 内联白名单一致；HTTPS DNS 不要求节点支持 UDP。
  nameserver-policy:
    "book-api-dev-en.taoxtao.cn":
      - "https://1.1.1.1/dns-query#📖 小说开发"
      - "https://8.8.8.8/dns-query#📖 小说开发"
