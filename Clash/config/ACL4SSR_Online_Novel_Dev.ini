[custom]
; 小说开发专用订阅转换模板（Clash.Meta / Mihomo）
; 仅保留手动选择、小说开发、自动选择三个策略组。
; 小说业务 / Facebook / Firebase / Google 广告 SDK 进入小说开发。
; 国内与局域网直连，常规境外服务及兜底流量走手动选择。
; 不加载 BanAD / 应用净化规则，保留广告 SDK 测试能力。
; 这是分流模板，不包含节点订阅或 DNS/TUN 设置。

; 局域网保持直连，方便手机连接开发机等设备
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 业务域名必须优先于任何国内直连或兜底规则
ruleset=📖 小说开发,https://raw.githubusercontent.com/hewei2723/ACL4SSR/main/Clash/Ruleset/Novel_Dev.list

; 常规境外服务；小说开发规则在前，优先匹配业务和 SDK
ruleset=🚀 手动选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=🚀 手动选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; 国内服务直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=DIRECT,[]GEOIP,CN

; 未匹配流量走常规代理，方便访问其他境外网站
ruleset=🚀 手动选择,[]FINAL

; 需要操作的组放在前面，自动测速组置后
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=📖 小说开发`select`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,100

enable_rule_generator=true
overwrite_original_rules=true
