[custom]
; 客户端小说测试白名单配置（Clash.Meta / Mihomo）
; 策略组从 ACL4SSR_Online_Mini_AI_Auto.ini 复制，仅保留节点选择、手动切换、小说开发和自动地区组。
; 白名单内域名走小说开发，其余全部 DIRECT；不启用广告拦截。
; 不指定 DNS 基础文件或 DNS 出口，DNS 与入站设置沿用转换器/客户端。
; 白名单内联自 Novel_Router.list，避免转换时额外拉取白名单失败。
; 共享 SDK 域名也会匹配其他应用，无法依据域名识别 App。
; 版本 novel-client-20261020

; 局域网直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 小说接口、Facebook、Firebase、FCM 与广告 SDK 白名单
ruleset=📖 小说开发,[]DOMAIN,book-api-dev-en.taoxtao.cn
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,littleze.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,yoread.cyou
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,oread.cyou
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,funread.cyou
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,facebook.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,facebook.net
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,fb.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,fbcdn.net
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,fbsbx.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,accountkit.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,firebaseio.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,firebasedatabase.app
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,firebaseapp.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,crashlytics.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,google-analytics.com
ruleset=📖 小说开发,[]DOMAIN-SUFFIX,app-measurement.com
