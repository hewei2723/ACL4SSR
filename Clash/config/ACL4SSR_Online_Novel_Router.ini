[custom]
; 路由器小说测试专用订阅转换模板（Clash.Meta / Mihomo）
; 手动选择、小说开发、全部自动及六个地区自动组。
; 小说业务 / Facebook / Firebase / Google 广告 SDK 进入小说开发。
; 仅小说白名单走代理，其他所有流量直连。
; Facebook / Firebase / 广告 SDK 域名是共享服务，无法据此识别具体 App。
; 不加载 BanAD / 应用净化规则，保留广告 SDK 测试能力。
; 这是分流模板，不包含节点订阅或 DNS/TUN 设置。

; 局域网保持直连，方便手机连接开发机等设备
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 业务域名必须优先于任何国内直连或兜底规则
ruleset=📖 小说开发,https://raw.githubusercontent.com/hewei2723/ACL4SSR/main/Clash/Ruleset/Novel_Router.list

; 未匹配流量全部直连，不提供通用境外代理
ruleset=DIRECT,[]FINAL

; 分组定义复制自 ACL4SSR_Online_Mini_AI_Auto.ini
; 小说开发对应原节点选择；地区匹配、测速地址、间隔和容差完全一致
; 需要操作的组放在前面，自动测速组置后
custom_proxy_group=📖 小说开发`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇨🇳 台湾自动`[]🇰🇷 韩国自动`[]DIRECT
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇭🇰 香港自动`url-test`(港|香港|HK|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇺🇸 美国自动`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|US|United States)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇸🇬 新加坡自动`url-test`(新加坡|狮城|坡|SG|Singapore)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇯🇵 日本自动`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇨🇳 台湾自动`url-test`(台|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇰🇷 韩国自动`url-test`(韩|韓|首尔|KR|Korea|KOR)`http://www.gstatic.com/generate_204`600,,100

enable_rule_generator=true
overwrite_original_rules=true
