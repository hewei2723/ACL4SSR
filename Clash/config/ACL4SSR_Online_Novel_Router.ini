[custom]
; 小说测试白名单配置：本地 Clash.Meta / Mihomo 与 OpenClash 通用
; 结构参考 ACL4SSR_Online_Mini_AI_Auto.ini，版本 novel-common-20261020。
; 仅业务 API、Facebook、Firebase 和广告 SDK 白名单走小说开发；其余全部直连。
; 不加载通用翻墙、广告拦截、应用净化规则。
; 白名单与局域网规则内联，无需客户端从 GitHub 下载 rule-provider。
; 使用专用 DNS 基础文件：所有域名及节点的 DNS 查询统一直连。
; 若客户端再次覆写 DNS，需关闭对应覆写才能使用本模板 DNS。
; Facebook/Firebase 等是共享域名，无法据域名识别具体 App。

; 局域网保持直连
ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve

