[custom]
; 路由器公共网络小说测试配置：仅白名单代理，其他一律 DIRECT
; 独立于日常模板与 Novel_Dev；不加载通用代理、广告拦截、AI 或流媒体规则。
; Facebook / Firebase / 广告 SDK 是共享服务，域名分流无法识别具体 App。
; 本文件为 subconverter 模板，不包含节点、路由器 DNS / TUN / 防火墙设置。
; 路由器需使用规则模式；本模板不能阻止用户自行部署其他 VPN。

; 局域网直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 业务 API 与 SDK 白名单（必须在最终直连前）
ruleset=📖 小说开发,https://raw.githubusercontent.com/hewei2723/ACL4SSR/main/Clash/Ruleset/Novel_Router.list

; 无通用境外代理：未匹配请求全部直连
ruleset=DIRECT,[]FINAL

; 小说开发可按地区自动测速，也可选全节点自动、手动节点或 DIRECT
; 默认保留全节点自动；自动测速组统一置后
custom_proxy_group=📖 小说开发`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇨🇳 台湾自动`[]🇰🇷 韩国自动`[]DIRECT
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇭🇰 香港自动`url-test`(?i)(香港|港|\bHK\b|Hong[ -]?Kong)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇺🇸 美国自动`url-test`(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|硅谷|达拉斯|芝加哥|\bUS\b|\bUSA\b|United[ -]?States)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇸🇬 新加坡自动`url-test`(?i)(新加坡|狮城|獅城|\bSG\b|Singapore)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇯🇵 日本自动`url-test`(?i)(日本|东京|東京|大阪|\bJP\b|Japan)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇨🇳 台湾自动`url-test`(?i)(台湾|台灣|台北|新北|彰化|\bTW\b|Taiwan)`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇰🇷 韩国自动`url-test`(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea)`http://www.gstatic.com/generate_204`600,,100

enable_rule_generator=true
overwrite_original_rules=true
