[custom]
; 家宽落地专用：MiSub 内置转换引擎 + Mihomo / Clash.Meta
; 境内直连，其他流量由“节点选择”控制，默认使用家宽链路。
; 先在 MiSub 导入机场入口和家宽落地；将落地节点名称加上 家庭宽带 标记。
; 订阅转换时禁用内置额外分流（ruleLevel=none），只使用本模板。
; 家宽链路沿用已验证的 custom_chain_proxy / dialer-proxy 写法。
; 需要部署支持落地筛选的 MiSub 链式展开修复；仅生成名称含“家庭宽带”的落地副本。
; 无匹配落地时使用 REJECT，不能自动退回机场出口。
; 家宽组无自动回退；地区自动/手动选择为用户主动绕过家宽的备用出口。
; 地区测速仅测机场入口，不代表家宽链路端到端可用。
; DNS 默认 DIRECT，避免默认 UDP DNS 经不支持 UDP 的落地失败；可手动选择家宽。
; 本 INI 不设置 DNS 服务器或协议；MiSub 的 DNS 覆写另行控制。
; 定位拦截是网络辅助，不能关闭 GPS/系统定位权限。
; www.googleapis.com 兼有其它 API：为拦截 /geolocation 路径，接受整域拦截副作用。
; 不包含广告拦截，不修改现有自用模板。

; 定位拦截最优先：包含 Google 定位及 Apple 常用网络定位入口
ruleset=REJECT,[]DOMAIN,geolocation.googleapis.com
ruleset=REJECT,[]DOMAIN,www.googleapis.com
ruleset=REJECT,[]DOMAIN-SUFFIX,googlelocation.services.googleapis.com
ruleset=REJECT,[]DOMAIN-SUFFIX,gs-loc.apple.com
ruleset=REJECT,[]DOMAIN-SUFFIX,ls.apple.com

; Google 全家桶固定走家宽：优先于国内域名/IP直连，不受主节点选择影响
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,google.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,google.cn
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,googleapis.cn
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gstatic.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gstatic.cn
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,ggpht.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,youtube.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,youtube-nocookie.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,youtu.be
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,ytimg.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,yt.be
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gmail.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,antigravity.google
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,ai.google
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,withgoogle.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,firebase.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,firebaseapp.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,firebaseio.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,firebasestorage.app
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,g.co
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,goo.gl
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,1e100.net
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gvt0.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gvt1.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gvt2.com
ruleset=🏠 家宽链路,[]DOMAIN-SUFFIX,gvt3.com
ruleset=🏠 家宽链路,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list

; 局域网与国内服务直连，不加载通用 Download / UnBan 例外表
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=🚀 节点选择,[]FINAL

; 主出口：家宽优先，亦可主动切换为机场地区或手动节点
custom_proxy_group=🚀 节点选择`select`[]🏠 家宽链路`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇨🇳 台湾自动`[]🇰🇷 韩国自动`[]🚀 手动选择

; 家宽在前、入口在后；在家宽组内手动选择标记为 家庭宽带 的落地副本
custom_proxy_group=🏠 家宽链路`select`[]REJECT`(家庭宽带)
custom_proxy_group=🔗 前置入口`select`[]🇭🇰 香港自动`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇨🇳 台湾自动`[]🇰🇷 韩国自动`[]🚀 手动选择
custom_chain_proxy=🏠 家宽链路`🔗 前置入口

; 只从未标记为 家庭宽带 的机场原始节点中选择入口
custom_proxy_group=🚀 手动选择`select`(^(?!.*家庭宽带).*$)

; DNS 与业务独立，默认采用已验证的直连查询路径
custom_proxy_group=🌐 DNS 出口`select`[]DIRECT`[]🏠 家宽链路`[]🔗 前置入口

; 自动组集中放在最后：只测机场入口，排除带 家庭宽带 标记的落地
custom_proxy_group=🇭🇰 香港自动`url-test`(^(?!.*家庭宽带).*(?:港|香港|HK|Hong Kong|HongKong).*$)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇺🇸 美国自动`url-test`(^(?!.*家庭宽带).*(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|US|United States).*$)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇸🇬 新加坡自动`url-test`(^(?!.*家庭宽带).*(?:新加坡|狮城|坡|SG|Singapore).*$)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇯🇵 日本自动`url-test`(^(?!.*家庭宽带).*(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan).*$)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇨🇳 台湾自动`url-test`(^(?!.*家庭宽带).*(?:台|新北|彰化|TW|Taiwan).*$)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇰🇷 韩国自动`url-test`(^(?!.*家庭宽带).*(?:韩|韓|首尔|KR|Korea|KOR).*$)`https://www.gstatic.com/generate_204`600,,100

enable_rule_generator=true
overwrite_original_rules=true
