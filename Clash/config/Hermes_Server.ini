[custom]
; ============================================================
; Hermes 服务器专用配置（目标：Clash.Meta / Mihomo）
; ------------------------------------------------------------
; 目的：
;   1) Hermes 关键链路（模型 API + 微信通道 + 官方源）强制“直连”，
;      绝不被任何代理组接管 —— 保证服务器上的 Hermes 网关永不掉线；
;   2) 在保活的前提下，Google / OpenAI / YouTube / GitHub 等境外服务
;      仍可正常走代理访问。
;
; 用法：
;   交给 subconverter（配机场订阅）转换 → 输出 Clash.Meta 订阅 →
;   服务器上的 mihomo 下载该订阅并使用。
;
; 关键点：本文件最重要的就是第 0 节，必须放在最前面（规则自上而下匹配）。
; ============================================================

; ---------- 0. 【最高优先级】Hermes 关键域名：强制直连 ----------
; 模型 API（config.yaml 里的 custom provider: https://api.modelarts-maas.com/v2）
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,modelarts-maas.com
; 微信 iLink 网关与 CDN（Hermes 微信通道）
;   WEIXIN_BASE_URL      = https://ilinkai.weixin.qq.com
;   WEIXIN_CDN_BASE_URL  = https://novac2c.cdn.weixin.qq.com/c2c
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,weixin.qq.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,weixin.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,wechat.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,weixinbridge.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,tencent.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,gtimg.cn
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,qpic.cn
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,qlogo.cn
; Hermes 官方文档 / 更新源
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,nousresearch.com

; ---------- 1. 局域网 / 明确放行 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; ---------- 2. 广告拦截（保守，仅基础规则） ----------
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; ---------- 3. 微信/腾讯媒体全家桶：TUN 下优先直连 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat.list

; ---------- 4. Google Maven / SDK（进开发组，避免被直连抢先） ----------
ruleset=🧑‍💻 开发服务,[]DOMAIN,dl.google.com
ruleset=🧑‍💻 开发服务,[]DOMAIN,dl-ssl.google.com
ruleset=🧑‍💻 开发服务,[]DOMAIN,maven.google.com
ruleset=🧑‍💻 开发服务,[]DOMAIN-SUFFIX,gvt1.com

; ---------- 5. AI 平台：走代理 ----------
ruleset=💬 AI平台,[]DOMAIN,api.typesafe.ai
ruleset=💬 AI平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 AI平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; ---------- 6. 国内开发镜像固定直连（必须在开发服务之前） ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/hewei2723/ACL4SSR/main/Clash/Ruleset/Developer_Mirror_Direct.list

; ---------- 7. 其他开发工具 / 代码托管 / 依赖仓库（走开发组） ----------
ruleset=🧑‍💻 开发服务,https://raw.githubusercontent.com/hewei2723/ACL4SSR/main/Clash/Ruleset/Developer_Custom.list

; ---------- 8. Steam 中国区资源优先直连（在完整 Steam 规则之前） ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; ---------- 9. 视频 / 社交 / 游戏：独立娱乐分组 ----------
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,linux.do
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,whatsapp.com
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,whatsapp.net
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,wa.me
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,instagram.com
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,cdninstagram.com
ruleset=🎬 社交娱乐,[]DOMAIN-SUFFIX,facebook.com
